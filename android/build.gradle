// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    // Pinned 2.2.x: react-native-iap v14 (openiap-google, billing-ktx 8.3) ships
    // Kotlin 2.2 metadata — the catalog default (2.0.x) cannot read it.
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Google Play requires target API 36 (Android 16) from 31 August 2026, or the
// app can no longer ship updates at all.
//
// Expo's root plugin sets these with setIfNotExist() and defaults to 35, so
// declaring them here wins — and avoids a full Expo SDK upgrade, which would
// churn every native dependency for what is really a two-line requirement.
//
// This block must stay ABOVE `apply plugin: "expo-root-project"`, otherwise the
// plugin has already installed its defaults by the time this runs.
ext {
  compileSdkVersion = 36
  targetSdkVersion = 36
  minSdkVersion = 24
  buildToolsVersion = "36.0.0"
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
